#!name=波点音乐去广告
#!desc=开屏/首页广告模块/弹窗/banner/播放页广告（Quantumult X）
#
# 引用地址（QX → 重写 → 引用）：
#   https://cdn.jsdelivr.net/gh/SI0NIS/qx-rules@main/bodian-ad.conf
#
# advert/earning/**（听歌赚金币）已按需求屏蔽：全部返回 439 空数据
# 音频 CDN（car-er/car-lv/car-lw.kuwo.cn）绝不可屏蔽，否则无法播放

[rewrite_local]
^https?://bd-api\.kuwo\.cn/api/advert/earning/ url script-response-body https://cdn.jsdelivr.net/gh/SI0NIS/qx-rules@0079d311ea7c6083370c727359b97dd24a386ffc/bodian_ad.js
^https?://bd-api\.kuwo\.cn/api/service/home/index url script-response-body https://cdn.jsdelivr.net/gh/SI0NIS/qx-rules@0079d311ea7c6083370c727359b97dd24a386ffc/bodian_ad.js
^https?://bd-api\.kuwo\.cn/api/service/conf/all url script-response-body https://cdn.jsdelivr.net/gh/SI0NIS/qx-rules@0079d311ea7c6083370c727359b97dd24a386ffc/bodian_ad.js
^https?://bd-api\.kuwo\.cn/api/(service/advert/config|service/banner/positions|play/advert/info|rec/feed) url script-response-body https://cdn.jsdelivr.net/gh/SI0NIS/qx-rules@0079d311ea7c6083370c727359b97dd24a386ffc/bodian_ad.js
^https?://bd-api\.kuwo\.cn/api/(popup/(mine|scene|start)/info|service/v2/openscreen/index|service/version/popup|pay/vip/invitation/(swell|assist)/popup) url script-response-body https://cdn.jsdelivr.net/gh/SI0NIS/qx-rules@0079d311ea7c6083370c727359b97dd24a386ffc/bodian_ad.js

[mitm]
hostname = %APPEND% bd-api.kuwo.cn
